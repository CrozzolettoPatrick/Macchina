<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HoChiusoLaMacchina?">
  <title>HoChiusoLaMacchina?</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- ── AUTH VIEW ── -->
  <div id="auth-view">
    <div class="auth-container">

      <!-- LOGO: macchina aperta + ? + macchina chiusa -->
      <div class="auth-logo">
        <div class="logo-cars">

          <!-- Macchina APERTA (rossa) -->
          <div class="car-state">
            <svg width="32" height="28" viewBox="0 0 32 28" fill="none">
              <!-- lucchetto aperto -->
              <path d="M8,14 L8,10 Q8,5 14,5 Q20,5 20,10" stroke="#ff453a" stroke-width="2" fill="none" stroke-linecap="round"/>
              <rect x="6" y="14" width="16" height="13" rx="3" fill="none" stroke="#ff453a" stroke-width="2"/>
              <circle cx="14" cy="21" r="2.5" fill="#ff453a"/>
              <line x1="14" y1="21" x2="14" y2="24" stroke="#ff453a" stroke-width="2" stroke-linecap="round"/>
              <!-- lucchetto aperto: ganascia sganciata -->
              <path d="M20,10 Q24,8 24,5" stroke="#ff453a" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
            <svg width="90" height="52" viewBox="0 0 80 48" fill="none">
              <!-- carrozzeria -->
              <path d="M3,38 L3,27 Q3,22 8,22 L16,22 L27,12 L52,12 L63,22 L70,22 Q75,22 75,27 L75,38 Z"
                    fill="#ff453a18" stroke="#ff453a" stroke-width="2" stroke-linejoin="round"/>
              <!-- lunotto posteriore -->
              <path d="M52,12 L62,22 L44,22 Z" fill="#ff453a25"/>
              <!-- parabrezza -->
              <path d="M27,12 L17,22 L38,22 Z" fill="#ff453a25"/>
              <!-- ruota sx -->
              <circle cx="17" cy="38" r="9" fill="#111" stroke="#ff453a" stroke-width="2"/>
              <circle cx="17" cy="38" r="4" fill="#ff453a"/>
              <!-- ruota dx -->
              <circle cx="62" cy="38" r="9" fill="#111" stroke="#ff453a" stroke-width="2"/>
              <circle cx="62" cy="38" r="4" fill="#ff453a"/>
            </svg>
            <span class="car-label car-label-red">Aperta</span>
          </div>

          <!-- Punto interrogativo -->
          <div class="logo-question">?</div>

          <!-- Macchina CHIUSA (verde) -->
          <div class="car-state">
            <svg width="32" height="28" viewBox="0 0 32 28" fill="none">
              <!-- lucchetto chiuso -->
              <path d="M8,14 L8,10 Q8,5 14,5 Q20,5 20,10 L20,14" stroke="#30d158" stroke-width="2" fill="none" stroke-linecap="round"/>
              <rect x="6" y="14" width="16" height="13" rx="3" fill="none" stroke="#30d158" stroke-width="2"/>
              <circle cx="14" cy="21" r="2.5" fill="#30d158"/>
              <line x1="14" y1="21" x2="14" y2="24" stroke="#30d158" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <svg width="90" height="52" viewBox="0 0 80 48" fill="none">
              <!-- carrozzeria -->
              <path d="M3,38 L3,27 Q3,22 8,22 L16,22 L27,12 L52,12 L63,22 L70,22 Q75,22 75,27 L75,38 Z"
                    fill="#30d15818" stroke="#30d158" stroke-width="2" stroke-linejoin="round"/>
              <!-- lunotto posteriore -->
              <path d="M52,12 L62,22 L44,22 Z" fill="#30d15825"/>
              <!-- parabrezza -->
              <path d="M27,12 L17,22 L38,22 Z" fill="#30d15825"/>
              <!-- ruota sx -->
              <circle cx="17" cy="38" r="9" fill="#111" stroke="#30d158" stroke-width="2"/>
              <circle cx="17" cy="38" r="4" fill="#30d158"/>
              <!-- ruota dx -->
              <circle cx="62" cy="38" r="9" fill="#111" stroke="#30d158" stroke-width="2"/>
              <circle cx="62" cy="38" r="4" fill="#30d158"/>
            </svg>
            <span class="car-label car-label-green">Chiusa</span>
          </div>

        </div>
      </div>

      <h1 class="auth-title">HoChiuso<br>LaMacchina?</h1>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Accedi</button>
        <button class="auth-tab" data-tab="register">Registrati</button>
      </div>
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Email" autocomplete="email" required>
        <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" class="btn-primary" id="auth-submit">Accedi</button>
      </form>
      <p id="auth-error" class="error-msg"></p>
    </div>
  </div>

  <!-- ── APP VIEW ── -->
  <div id="app-view" class="hidden">

    <header class="app-header">
      <span class="app-title">HoChiusoLaMacchina?</span>
      <div class="header-right">
        <span id="header-email" class="header-email"></span>
        <button id="btn-logout" class="btn-icon">Esci</button>
      </div>
    </header>

    <main class="app-main">

      <!-- STATO: IDLE -->
      <div id="state-idle">
        <p class="state-label">La macchina è aperta</p>
        <button id="btn-chiudi" class="btn-main btn-green">CHIUDI</button>
      </div>

      <!-- STATO: CHIUSA -->
      <div id="state-locked" class="hidden">
        <div class="locked-header">
          <div class="locked-badge">CHIUSA</div>
          <div id="locked-time" class="locked-time"></div>
          <div id="locked-note" class="locked-note hidden"></div>
        </div>
        <div id="map" class="map-container"></div>
        <button id="btn-add-note" class="btn-note">+ Aggiungi nota</button>
        <button id="btn-navigate" class="btn-main btn-blue">PORTAMI ALLA MACCHINA</button>
        <button id="btn-apri" class="btn-secondary">APRI</button>
      </div>

    </main>

    <!-- STORICO -->
    <div class="history-section">
      <button id="history-toggle" class="history-toggle">
        <span>Storico parcheggi</span>
        <span class="toggle-arrow">▼</span>
      </button>
      <div id="history-list" class="history-list hidden"></div>
    </div>

  </div>

  <!-- ── MODALE NOTE ── -->
  <div id="note-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <button id="note-close" class="modal-close">✕</button>
      <h3 class="modal-title">Aggiungi una nota</h3>
      <p class="modal-sub">Opzionale — es. "Piano B2, posto 47"</p>
      <textarea id="note-input" class="note-textarea" placeholder="Scrivi qui..."></textarea>
      <button id="note-confirm" class="btn-primary">Salva nota</button>
    </div>
  </div>

  <!-- ── LOADING ── -->
  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
    <p class="loading-text">Acquisizione GPS...</p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
